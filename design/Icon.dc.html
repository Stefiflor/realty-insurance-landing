<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; }
    a { color: #3E8E96; } a:hover { color: #2C6B72; }
    svg { display: block; }
  </style>
</helmet>

<sc-if value="{{isSale}}" hint-placeholder-val="{{true}}">
  <svg width="{{size}}" height="{{size}}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 10.5 12 3l9 7.5"></path><path d="M5.5 9.5V20h13V9.5"></path><path d="M10 20v-5.5h4V20"></path>
  </svg>
</sc-if>

<sc-if value="{{isKey}}" hint-placeholder-val="{{false}}">
  <svg width="{{size}}" height="{{size}}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="8" cy="15" r="4"></circle><path d="M10.8 12.2 20 3"></path><path d="M17 6l2.5 2.5"></path><path d="M14.5 8.5 17 11"></path>
  </svg>
</sc-if>

<sc-if value="{{isLand}}" hint-placeholder-val="{{false}}">
  <svg width="{{size}}" height="{{size}}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 19h18"></path><path d="M4 19V9l8-5 8 5v10"></path><path d="M4 13h16"></path><path d="M12 4v15"></path>
  </svg>
</sc-if>

<sc-if value="{{isShield}}" hint-placeholder-val="{{false}}">
  <svg width="{{size}}" height="{{size}}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"></path>
  </svg>
</sc-if>

<sc-if value="{{isUsers}}" hint-placeholder-val="{{false}}">
  <svg width="{{size}}" height="{{size}}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M16 20v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="3.4"></circle><path d="M22 20v-2a4 4 0 0 0-3-3.9"></path><path d="M16 3.6a4 4 0 0 1 0 7"></path>
  </svg>
</sc-if>

<sc-if value="{{isRent}}" hint-placeholder-val="{{false}}">
  <svg width="{{size}}" height="{{size}}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 21V8l8-5 8 5v13"></path><path d="M9 21v-6h6v6"></path>
  </svg>
</sc-if>

<sc-if value="{{isTool}}" hint-placeholder-val="{{false}}">
  <svg width="{{size}}" height="{{size}}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14.7 6.3a4 4 0 0 1 5 5L20 12l-8 8-4-4 8-8Z"></path><path d="M4 20l3-3"></path>
  </svg>
</sc-if>

<sc-if value="{{isWa}}" hint-placeholder-val="{{false}}">
  <svg width="{{size}}" height="{{size}}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20.5 16.5v3a2 2 0 0 1-2.2 2 19.5 19.5 0 0 1-8.5-3 19 19 0 0 1-6-6 19.5 19.5 0 0 1-3-8.6A2 2 0 0 1 2.8 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L6.8 9.8a16 16 0 0 0 6 6l1.2-1.2a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2Z"></path>
  </svg>
</sc-if>

<sc-if value="{{isMail}}" hint-placeholder-val="{{false}}">
  <svg width="{{size}}" height="{{size}}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2.5" y="4.5" width="19" height="15" rx="2"></rect><path d="M3 6l9 6.5L21 6"></path>
  </svg>
</sc-if>

<sc-if value="{{isPin}}" hint-placeholder-val="{{false}}">
  <svg width="{{size}}" height="{{size}}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"></path><circle cx="12" cy="10" r="2.6"></circle>
  </svg>
</sc-if>
</x-dc>

<script data-dc-script data-props='{
  "icon": {"editor": "enum", "options": ["sale", "key", "land", "shield", "users", "rent", "tool", "wa", "mail", "pin"], "default": "sale"},
  "size": {"editor": "int", "default": 20, "min": 12, "max": 48},
  "$preview": {"width": 24, "height": 24}
}'>
class Component extends DCLogic {
  renderVals() {
    const n = this.props.icon ?? 'sale';
    return {
      size: this.props.size ?? 20,
      isSale: n === 'sale', isKey: n === 'key', isLand: n === 'land',
      isShield: n === 'shield', isUsers: n === 'users', isRent: n === 'rent',
      isTool: n === 'tool', isWa: n === 'wa', isMail: n === 'mail', isPin: n === 'pin'
    };
  }
}
</script>
</body>
</html>
